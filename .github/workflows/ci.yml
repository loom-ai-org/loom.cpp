name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The toy-model fixtures tests/ci/ regenerates at ctest time only need gguf/numpy. The heavier
      # deps (torch, transformers, librosa) belong to the loom-exporter repo, which is what produces
      # the real-model fixtures tests/gate/ reads -- and those are not run here at all.
      # Pinned exactly: these two write the toy-model fixtures the C++ tests compare against, so an
      # unpinned resolve makes CI's inputs a moving target and lets a green suite go red with no repo
      # change. Bump deliberately, and re-run the suite when you do.
      - name: Install Python dependencies
        run: pip install "gguf==0.17.1" "numpy==2.4.6"

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      # ggml/nlohmann_json are fetched fresh via CMake FetchContent (see cmake/Dependencies.cmake) on
      # every configure; only compiled-object reuse is cached here, not the fetched sources themselves.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake') }}-
            ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # `-L ci` rather than the whole suite, and the distinction is the point: tests/gate/ compares
      # against real exported checkpoints, which are gigabytes this runner will never have. Running
      # them here would report 78 Skipped alongside the real results and turn a green suite into
      # something you have to read carefully. `scripts/fixtures.py` and `ctest -L gate` are how those
      # are run, on a machine that has the fixtures.
      - name: Test
        run: ctest --test-dir build -L ci --output-on-failure
